[project]
name = "credit-risk-ai"
version = "0.1.0"
description = "Credit default risk model on the Give Me Some Credit dataset."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",   # api.py: HTTP API
    "joblib>=1.3",      # train.py / api.py: save and load the model file
    "mlflow>=3.0",      # train.py: experiment tracking
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "uvicorn>=0.29",    # runs the API server
]

[dependency-groups]
dev = [
    "httpx",  # needed by FastAPI's TestClient in tests/test_api.py
    "ipykernel",
    "matplotlib",
    "pytest>=8",
    "xlrd",  # reads data/raw/Data Dictionary.xls in the notebooks
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
