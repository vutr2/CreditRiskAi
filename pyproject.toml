[project]
name = "credit-risk-ai"
version = "0.1.0"
description = "Credit default risk model on the Give Me Some Credit dataset."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "ipykernel",
    "matplotlib",
    "pytest>=8",
    "xlrd",  # reads data/raw/Data Dictionary.xls in the notebooks
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
